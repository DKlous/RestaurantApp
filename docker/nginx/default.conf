# RestaurantApp — Nginx (reverse proxy naar PHP-FPM).
# Code is via bind-mount beschikbaar op /var/www; alleen public/ is toegankelijk.
server {
    listen 80;
    server_name _;

    # De publieke documentroot (niet /var/www, om config/ en src/ niet te blootstellen)
    root /var/www/public;
    index index.php index.html;

    # Alle niet-statische aanvragen worden naar index.php gerouteerd (Symfony front-controller).
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM: praat tegen de 'php'-service (php-fpm) op het compose-netwerk.
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bescherm de projectbestandenboom tegen directe HTTP-toegang.
    location ~ ^/(bin|config|src|templates|tests|var|vendor)/ {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
