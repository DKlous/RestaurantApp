[global]
daemonize = no

[www]
; De worker-gebruiker. In de 'php'-service draait dit op de host-gemonteerde mappen,
; dus op macOS (Docker Desktop) speelt de uid geen rol. Op Linux zou je de uid/gid
; met de host-gebruiker moeten laten samenvallen om schrijfrechten op ./var te krijgen.
user = www-data
group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 1000

; Belangrijk voor cross-container gebruik: luister op alle interfaces.
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

php_admin_value[error_log] = /var/log/php-fpm/error.log
